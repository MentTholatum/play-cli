[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "play-cli"
version = "0.7.0"
description = "Test-only qualification baseline for PLAY CLI"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[project.scripts]
playcli = "play_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
